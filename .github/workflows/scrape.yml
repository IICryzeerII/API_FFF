name: Scrape FFF Data

on:
  schedule:
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configuration de Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Rendre start.sh exécutable
        run: chmod +x start.sh

      - name: Lancement du script d'installation (start.sh)
        run: ./start.sh

      - name: Installation du navigateur Playwright
        run: |
          source venv/bin/activate
          playwright install chromium

      - name: Execution du scraper
        run: |
          source venv/bin/activate
          python main.py

      # 🔍 NOUVEAU : Sauvegarde des fichiers de debug si le scraping échoue ou pour analyse
      - name: Upload des artefacts de debug en cas de besoin
        uses: actions/upload-artifact@v4
        if: always() # S'exécute même si le step précédent a des soucis
        with:
          name: debug-logs-et-pages
          path: |
            *.png
            *.html
            *.json

      - name: Commit et Push des modifications JSON
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add *.json
          git diff --staged --quiet || git commit -m "chore: mise a jour automatique des donnees fff"
          git push